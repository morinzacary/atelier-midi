name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 build.py
      - run: git diff --exit-code -- apps/
      - run: node tests/reverse.test.cjs
      - run: node tests/reverse-ui.test.cjs
      - run: node tests/forward.test.cjs
      - run: python3 tests/validate_xml.py
